spring.application.name=auth-service
server.port=${PORT:8082}

# Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dungeoneer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.table=flyway_auth_history

# JWT Configuration
jwt.secret=${JWT_SECRET:dungeoneer_default_development_secret_key_minimum_256_bits_length!}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
